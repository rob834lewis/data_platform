<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmation</title>
<!-- Load Tailwind CSS from CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
    /* Custom font */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body {
        font-family: 'Inter', sans-serif;
        background-color: #f5ebe0; /* Warm cream background */
    }
</style>


</head>
<body>
<div class="min-h-screen p-4 sm:p-8 flex flex-col items-center justify-center">

    <!-- Confirmation Card -->
    <div class="w-full max-w-lg bg-white p-8 sm:p-10 rounded-xl shadow-2xl text-center border-t-8 border-[#4A2C2A]">
        
        <span class="text-6xl mb-4 inline-block">🎉</span>
        
        <h1 class="text-3xl font-extrabold text-[#4A2C2A] mb-4">Order Placed Successfully!</h1>
        
        <p class="text-gray-600 mb-6">Thank you, **{{ order.customer_name }}**! Your order is being prepared.</p>

        <!-- Order Details Box -->
        <div class="bg-gray-50 p-6 rounded-lg border border-gray-200">
            <h2 class="text-xl font-semibold text-gray-800 mb-3 border-b pb-2 border-gray-200">Your Details</h2>
            
            <div class="flex justify-between py-1">
                <span class="text-gray-600 font-medium">Item:</span>
                <span class="font-bold text-[#4A2C2A]">{{ order.coffee_name }}</span>
            </div>
            
            <div class="flex justify-between py-1">
                <span class="text-gray-600 font-medium">Price:</span>
                <span class="font-bold text-green-700">£{{ '%.2f' | format(order.coffee_price) }}</span>
            </div>

            <div class="flex justify-between py-1 border-t mt-3 pt-3 border-gray-200">
                <span class="text-gray-600 font-medium">Order ID:</span>
                <span class="font-semibold text-gray-800">#{{ order.id }}</span>
            </div>
            
        </div>

        <!-- Action Buttons -->
        <div class="mt-8 flex flex-col space-y-3 sm:flex-row sm:space-y-0 sm:space-x-4 justify-center">
            <a href="{{ url_for('dashboard') }}" 
               class="px-6 py-3 bg-orange-600 text-white font-semibold rounded-lg shadow-md hover:bg-orange-700 transition duration-150 transform hover:scale-105">
                View My Dashboard
            </a>
            <a href="{{ url_for('index') }}" 
               class="px-6 py-3 bg-gray-200 text-gray-800 font-semibold rounded-lg hover:bg-gray-300 transition duration-150">
                Order Another
            </a>
        </div>
        
    </div>
    
</div>


</body>
</html>
