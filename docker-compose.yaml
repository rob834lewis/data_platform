services:
  postgres:
    image: postgres:15
    container_name: data-coven-postgres
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck: 
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  # Service to initialize the Airflow database and create the admin user
  airflow-init:
    image: apache/airflow:3.1.1
    depends_on:
      postgres:
        condition: service_healthy 
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    
    # FINAL FIX: Use a simple, quoted script string to avoid all indentation/whitespace issues
    command: 
      - bash
      - -c
      - |
        echo 'Waiting for Postgres...';
        i=0;
        while ! pg_isready -h postgres -U airflow -t 1 && [ \$i -lt 30 ]; do
          sleep 1;
          i=\$((i+1));
        done;
        if [ \$i -eq 30 ]; then
          echo 'Error: Postgres never became ready. Aborting.';
          exit 1;
        fi;
        echo 'Postgres is ready. Starting migration.';
        cp /opt/airflow/mounted_config/airflow.cfg /tmp/airflow.cfg && 
        airflow db migrate

    volumes:
      - ./config/airflow.cfg:/opt/airflow/mounted_config/airflow.cfg:ro 
      - ./dags:/opt/airflow/dags

  # Service to run the Airflow API Server (Webserver service name, API command)
  airflow-webserver:
    image: apache/airflow:3.1.1
    container_name: data-coven-airflow-webserver
    depends_on:
      - postgres
    restart: always
    environment:
      AIRFLOW_CONFIG: /opt/airflow/airflow.cfg 
    ports:
      - "8080:8080"
    command: "airflow api-server"
    volumes:
      - ./config/airflow.cfg:/opt/airflow/airflow.cfg 
      - ./dags:/opt/airflow/dags

  # Service to run the Airflow Scheduler
  airflow-scheduler:
    image: apache/airflow:3.1.1
    container_name: data-coven-airflow-scheduler
    depends_on:
      - airflow-webserver
      - postgres
    restart: always
    environment:
      AIRFLOW_CONFIG: /opt/airflow/airflow.cfg
    command: "airflow scheduler"
    volumes:
      - ./config/airflow.cfg:/opt/airflow/airflow.cfg 
      - ./dags:/opt/airflow/dags

volumes:
  postgres_data: