<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee App Login</title>
<!-- Load Tailwind CSS for modern, responsive styling -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2%3Ffamily%3DInter:wght%40400%3B600%3B700%26display%3Dswap');
body { font-family: 'Inter', sans-serif; background-color: #f7f3eb; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div class="bg-white p-8 md:p-10 rounded-xl shadow-2xl w-full max-w-sm">
<h1 class="text-3xl font-bold text-[#6f4e37] text-center mb-6">Welcome to Coffee Order</h1>

    <p class="text-gray-600 mb-6 text-center">Please enter your name to start ordering and view your history.</p>
    
    {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            <span class="block sm:inline">{{ error }}</span>
        </div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
        <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
            <input type="text" id="username" name="username" required
                   class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-[#6f4e37] focus:border-[#6f4e37] sm:text-sm"
                   placeholder="e.g., Jane Doe">
        </div>
        
        <button type="submit"
                class="w-full py-3 bg-[#6f4e37] text-white rounded-lg font-semibold hover:bg-[#5a4130] transition duration-200 shadow-md">
            Enter
        </button>
    </form>

    <a href="{{ url_for('index') }}" class="mt-4 block text-center text-sm text-gray-500 hover:text-[#6f4e37]">
        Continue to Menu (as Guest)
    </a>
</div>


</body>
</html>
