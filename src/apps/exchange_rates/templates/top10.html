{% extends 'base.html' %}

{% block content %}
<table>
  <tr>
    {% for col in rows[0].keys() %}
      <th>{{ col }}</th>
    {% endfor %}
  </tr>
  {% for row in rows %}
    <tr>
      {% for val in row.values() %}
        <td>{{ val }}</td>
      {% endfor %}
    </tr>
  {% endfor %}
</table>
{% endblock %}
